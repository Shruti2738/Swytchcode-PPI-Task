VERSION: 2.0.2

METHODS:
  openf1.sessions.list:
    SUMMARY: Get Formula 1 race sessions
    DESC: Retrieve Formula 1 race sessions for a given year and session name.
    HTTP:
      METHOD: GET
      ENDPOINT: /sessions
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - year:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
      - session_name:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
    CANONICAL_ID: openf1.sessions.list

  openf1.drivers.list:
    SUMMARY: Get drivers for a race session
    DESC: Retrieve driver information for a Formula 1 session using its session key.
    HTTP:
      METHOD: GET
      ENDPOINT: /drivers
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - session_key:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
    CANONICAL_ID: openf1.drivers.list
